# Local Supabase settings. Hosted auth settings are pushed with
# `supabase config push` after `supabase link` (see docs/SETUP.md).
project_id = "personal-project-portal"

# Ports sit in 554xx, away from the 543xx defaults, so this stack runs beside
# other local Supabase projects (the defaults are often taken by work).

[api]
enabled = true
port = 55421
# `portal` is deliberately absent: it is reached only through public RPCs.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 55423

# Catches sign-in emails locally (Mailpit). Called [inbucket] before CLI v3.
[local_smtp]
enabled = true
port = 55424

[auth]
enabled = true
site_url = "http://localhost:3000"
# 3100 is the end-to-end suite's server (playwright.config.ts).
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3100/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Nobody signs themselves up. The owner invites mentors from the dashboard,
# and the portal sign-in form never creates users.
enable_signup = false

[auth.email]
# The whole email provider: false would also turn off email links. Sign-ups
# stay blocked by [auth] enable_signup above. (CLI v2 called this enable_signup.)
enabled = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

# Google sign-in. Uses the same Google Cloud OAuth client as the calendar
# connection; see docs/SETUP.md. Sign-ups stay off, so only invited accounts
# can sign in, and Supabase links the Google identity to the invited email.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[analytics]
enabled = false
