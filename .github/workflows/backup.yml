# A copy of the portal's data every night.
#
# The live database is on Supabase's Free plan, which keeps no backups. This
# dumps the `portal` schema's data (scripts/backup.sh) and encrypts it to the
# owner's public key before anything is uploaded: this repository is public, so
# its artifacts are too, and only the owner's private key, which never leaves
# their machine, can open the file. The Release workflow takes the same copy
# before each migration, and CI proves on every pull request that a copy restores
# row for row (the restore drill). docs/RESTORE.md is the way back.
#
# The job is skipped until the repository variables SUPABASE_PROJECT_REF and
# BACKUP_PUBLIC_KEY are set (docs/RESTORE.md, one-time setup).
name: Backup

on:
  schedule:
    # 02:17 UTC, when nothing else is running.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Back up the production data
    if: vars.SUPABASE_PROJECT_REF != '' && vars.BACKUP_PUBLIC_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment secrets, limited to main in the environment's settings.
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - name: Dump the data and encrypt it to the owner's key
        run: bash scripts/backup.sh encrypted backup --remote
      # Only encrypted files: the script refuses to finish with anything else in this folder.
      - name: Keep it for 90 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-backup-${{ github.run_id }}
          path: backup/*.gpg
          if-no-files-found: error
          retention-days: 90
