# Every pull request and every push to main. Two jobs, both required to merge:
#   Checks       fast and deterministic: format, lint, types, unit tests, dead code
#   Integration  the database tests and the end-to-end suite on a local Supabase,
#                then the restore drill: a backup of that database restores row for row
# The same commands run locally (npm run check, npm run test:db, npm run test:e2e).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run knip

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # config.toml reads these for the Google provider; any value starts the stack.
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Supabase (migrations and seed)
        # Starting the database has failed on a runner whose port was taken, a
        # transient clash; the second try on a clean slate has always worked.
        run: |
          for attempt in 1 2 3; do
            npm run db:start && exit 0
            npx supabase stop --no-backup || true
            sleep 5
          done
          exit 1
      - name: Database tests (pgTAP)
        run: npm run test:db
      - name: End-to-end, accessibility and screenshots
        run: npm run test:e2e
      - name: Keep every page as the owner sees it, for R&D (e2e/page-shots.spec.ts)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-shots
          path: test-results/page-shots/
          if-no-files-found: error
          retention-days: 14
      # The Backup and Release workflows copy the live data; this proves a copy comes back.
      # Last, because it wipes the database: back it up as production is (encrypted, to a
      # throwaway key), reset it, restore it, and compare every row (scripts/backup.sh).
      - name: Restore drill
        run: bash scripts/backup.sh drill
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
