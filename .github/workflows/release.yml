# Migrations reach production before the code that needs them.
#
# A merge to main starts two things at once: Vercel builds the new deployment,
# and this workflow applies any new migrations to the live database. Vercel's
# Deployment Checks hold the new deployment back from the live domain until the
# "Production database migrated" status passes (docs/FACTORY.md, one-time setup).
# If a migration fails, the old deployment keeps serving and nothing breaks.
#
# Before any migration is applied, the data is copied (scripts/backup.sh): dumped,
# encrypted to the owner's public key, and kept as an artifact for 90 days. If the
# copy fails, the migration does not run. A merge with no migration takes no copy.
# docs/RESTORE.md is the way back. Until the repository variable BACKUP_PUBLIC_KEY
# is set, migrations run without a copy and the run says so.
#
# The job is skipped until the repository variable SUPABASE_PROJECT_REF is set.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environment secrets, limited to main in the environment's settings.
    environment: production
    permissions:
      contents: read
      statuses: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # Vercel's Deployment Checks wait for this status, by name, before the new
      # deployment goes live. A commit status is what Vercel's check picker
      # lists reliably; the job's own check run appears only once it has run.
      - name: Tell Vercel the migration has started
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context="$STATUS" -f description="Applying migrations"
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: Production database migrated
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - name: Pending migrations
        id: pending
        run: |
          npx supabase migration list --remote
          echo "any=$(bash scripts/backup.sh pending --remote)" >> "$GITHUB_OUTPUT"
      - name: Back up the data before migrating
        if: steps.pending.outputs.any == 'true' && vars.BACKUP_PUBLIC_KEY != ''
        run: bash scripts/backup.sh encrypted backup --remote
        env:
          BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
      # Only encrypted files: the script refuses to finish with anything else in this folder.
      - name: Keep the backup for 90 days
        if: steps.pending.outputs.any == 'true' && vars.BACKUP_PUBLIC_KEY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-backup-before-${{ github.sha }}
          path: backup/*.gpg
          if-no-files-found: error
          retention-days: 90
      - name: Say that these migrations run without a backup
        if: steps.pending.outputs.any == 'true' && vars.BACKUP_PUBLIC_KEY == ''
        run: echo "::warning title=No backup before migrating::Set the repository variable BACKUP_PUBLIC_KEY to keep a copy of the data before each migration (docs/RESTORE.md)."
      # Runs only when every step above passed: a failed backup stops the migration.
      - name: Apply them
        run: npx supabase db push --remote --yes
      - name: Tell Vercel how it went
        if: always()
        run: |
          if [ "$OUTCOME" = "success" ]; then state=success; text="Migrations applied"; else state=failure; text="Backup or migration failed: the old deployment keeps serving"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="$STATUS" -f description="$text"
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: Production database migrated
          OUTCOME: ${{ job.status }}
