# Dependency updates, grouped so they arrive as at most two pull requests a
# week. CI, the guard and the screenshots check each one like any other PR.
# Security fixes come as soon as they are published, outside the schedule.
# Other releases wait a week (cooldown): most compromised packages are caught and
# pulled within days, before they would reach this repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors change behaviour (Next.js, ESLint, the Supabase CLI): one PR each,
    # so each can be read and tested on its own.
    commit-message:
      prefix: deps
    ignore:
      # Types follow the Node version the portal runs on (.nvmrc, engines):
      # move them with Node, not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint must support a TypeScript major before we can take it
      # (TypeScript 7 failed lint on 2026-11-13). Remove this once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
